services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    restart: unless-stopped
    # 不暴露端口到宿主机 — 仅 nginx 可访问
    expose:
      - "8000"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    # 仅监听本地回环 — 由宝塔 nginx 反向代理接入
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
