map "$realip_remote_addr:$http_x_forwarded_proto" $public_scheme {
    default $scheme;
    "172.30.248.1:https" https;
}

# 页面提交需要保留同源请求的来源。API 响应使用后端设置的策略。
map $uri $page_referrer_policy {
    default "same-origin";
    ~^/api/ "";
}

server {
    listen 80;
    server_name _;

    # 宿主机反向代理通过 Compose 网关访问回环发布的端口。
    set_real_ip_from 172.30.248.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 上传 / 请求体大小限制（视频下载 cookies 文本 + 字幕文本）
    client_max_body_size 10m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy $page_referrer_policy always;

    # 静态文件（SPA 路由回退）
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $public_scheme;

        # SSE 长连接由后端定期发送心跳。
        proxy_read_timeout 300s;
        proxy_buffering off;

        # 上传限制
        client_max_body_size 10m;
    }
}
