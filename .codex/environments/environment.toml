# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "万能视频下载器项目"

[setup]
script = ""

[[actions]]
name = "run magic_video"
icon = "run"
command = '''
bash <<'RUN_PROJECT'
set -e
export PATH="/opt/homebrew/bin:/opt/anaconda3/bin:$HOME/.workbuddy/binaries/node/versions/22.22.2/bin:$PATH"
export PYTHONDONTWRITEBYTECODE=1

project_dir="$(git rev-parse --show-toplevel)"
cd "$project_dir"

env_file="$project_dir/backend/.env"
if [ ! -f "$env_file" ]; then
  main_checkout="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"
  env_file="$main_checkout/backend/.env"
fi
if [ ! -f "$env_file" ]; then
  echo '找不到 backend/.env。请从 backend/.env.example 复制并填写配置。' >&2
  exit 1
fi

python="$project_dir/.venv/bin/python"
[ -x "$python" ] || python3.13 -m venv "$project_dir/.venv"
"$python" -m pip install -q --disable-pip-version-check -r backend/requirements.txt
[ -x frontend/node_modules/.bin/vite ] || (cd frontend && npm ci --include=dev)

api_port=8000
web_port=5173
while lsof -tiTCP:"$api_port" -sTCP:LISTEN >/dev/null ||
      lsof -tiTCP:"$web_port" -sTCP:LISTEN >/dev/null; do
  api_port=$((api_port + 1))
  web_port=$((web_port + 1))
done

(
  cd backend
  exec "$python" -m uvicorn main:app --reload --host 127.0.0.1 \
    --port "$api_port" --env-file "$env_file"
) &
api_pid=$!

cd "$project_dir/frontend"
API_PORT="$api_port" WEB_PORT="$web_port" node --input-type=module <<'VITE' &
import { createServer } from 'vite'

const server = await createServer({
  server: {
    host: '127.0.0.1',
    port: Number(process.env.WEB_PORT),
    strictPort: true,
    proxy: { '/api': { target: `http://127.0.0.1:${process.env.API_PORT}` } },
  },
})
await server.listen()
server.printUrls()
VITE
web_pid=$!

trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true; wait "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
trap 'exit 130' INT
trap 'exit 143' TERM
wait "$web_pid"
RUN_PROJECT'''
